<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Trainer</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#17233a;margin:0}main{max-width:850px;margin:auto;padding:24px}header{background:#192e58;color:white;padding:26px;border-radius:20px}h1{margin:0}section{background:white;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #152b5010}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1px solid #b5c3db;background:#fff;border-radius:12px;padding:10px;cursor:pointer}.chip.active{background:#244fa3;color:white}button{cursor:pointer;border:0;border-radius:11px;padding:12px 16px;background:#2454af;color:white;font-weight:650}button.secondary{background:#e8eefb;color:#24416f}input,select{padding:12px;border:1px solid #bdc9dc;border-radius:10px;font:inherit}input{width:min(90%,460px)}.word{font-size:clamp(27px,5vw,43px);font-weight:750;margin:20px 0}.muted{color:#61718a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.good{color:#15764c}.bad{color:#b33b40}.stats{display:flex;gap:25px;flex-wrap:wrap}label{display:block;margin:12px 0}small{color:#667}#feedback{min-height:44px;font-weight:650}footer{margin:30px 0;color:#61718a}</style></head><body><main><header><h1>English Trainer</h1><p>Slovíčka z učebnice · psaní · překlad · poslech · výslovnost</p></header><section><h2>1. Vyber lekce</h2><div id="lessons" class="chips"></div><p class="muted" id="selected"></p><label>Směr zkoušení <select id="direction"><option value="cz-en">Česky → anglicky</option><option value="en-cz">Anglicky → česky</option><option value="mix">Oba směry náhodně</option></select></label><label>Režim <select id="mode"><option value="write">Psaní a překlad</option><option value="speak">Výslovnost angličtiny</option><option value="listen">Poslech a zápis anglického slova</option></select></label><div class="actions"><button id="start">Začít procvičování</button><button class="secondary" id="all">Vybrat vše</button><button class="secondary" id="none">Zrušit výběr</button></div></section><section id="quiz" hidden><div class="stats"><span id="progress"></span><span id="score"></span></div><div id="prompt" class="word"></div><p id="instruction" class="muted"></p><div id="answerarea"><input id="answer" autocomplete="off" spellcheck="false" placeholder="Napiš odpověď"><button id="check">Zkontrolovat</button></div><div class="actions"><button id="play" class="secondary">🔊 Poslechnout AJ</button><button id="mic" class="secondary">🎤 Vyslovit</button><button id="reveal" class="secondary">Ukázat odpověď</button><button id="next">Další →</button></div><div id="feedback" aria-live="polite"></div></section><section><h2>Moje výsledky</h2><p id="summary">Zatím žádné odpovědi.</p><button id="mistakes" class="secondary">Procvičit chybné odpovědi</button><button id="reset" class="secondary">Smazat výsledky</button></section><footer>Funguje bez účtu. Výsledky se ukládají jen v tomto prohlížeči. Mikrofon vyžaduje HTTPS nebo localhost a podporovaný prohlížeč.</footer></main><script>

const $=id=>document.getElementById(id), keys=Object.keys(data), selected=new Set(keys.slice(0,1));let deck=[],i=0,correct=0,answered=false,wrong=[];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9á-ž ]/gi,' ').replace(/\s+/g,' ').trim();function draw(){ $('lessons').innerHTML='';keys.forEach(k=>{let b=document.createElement('button');b.className='chip'+(selected.has(k)?' active':'');b.textContent=k+' ('+data[k].length+')';b.onclick=()=>{selected.has(k)?selected.delete(k):selected.add(k);draw()};$('lessons').append(b)});$('selected').textContent=`Vybráno ${selected.size} částí · ${keys.filter(k=>selected.has(k)).reduce((s,k)=>s+data[k].length,0)} slovíček`};draw();$('all').onclick=()=>{keys.forEach(k=>selected.add(k));draw()};$('none').onclick=()=>{selected.clear();draw()};function shuffle(a){return a.sort(()=>Math.random()-.5)}function start(list){deck=shuffle(list);i=0;correct=0;answered=false;wrong=[];$('quiz').hidden=false;show();$('quiz').scrollIntoView({behavior:'smooth'})} $('start').onclick=()=>{let list=keys.filter(k=>selected.has(k)).flatMap(k=>data[k].map(([en,cz])=>({en,cz,k})));if(!list.length)return alert('Vyber alespoň jednu lekci.');start(list)};let item,dir;function show(){if(i>=deck.length){$('prompt').textContent='Hotovo!';$('instruction').textContent='Procvičování dokončeno.';$('answerarea').hidden=true;$('feedback').textContent=`Správně ${correct} z ${deck.length}.`;$('progress').textContent='Konec';$('score').textContent='';save();return}item=deck[i];dir=$('direction').value==='mix'?(Math.random()<.5?'cz-en':'en-cz'):$('direction').value;if($('mode').value==='listen')dir='cz-en';answered=false;$('answerarea').hidden=$('mode').value==='speak';$('answer').value='';$('feedback').textContent='';$('progress').textContent=`Otázka ${i+1} / ${deck.length}`;$('score').textContent=`Správně ${correct}`;$('prompt').textContent=$('mode').value==='listen'?'Poslechové cvičení':$('mode').value==='speak'?item.en:(dir==='cz-en'?item.cz:item.en);$('instruction').textContent=$('mode').value==='speak'?'Vyslov anglické slovíčko do mikrofonu.':$('mode').value==='listen'?'Poslechni si slovo a napiš ho anglicky.':dir==='cz-en'?'Napiš anglický překlad.':'Napiš český překlad.';if($('mode').value==='listen')say();}function say(){if(!item||!('speechSynthesis'in window))return alert('Prohlížeč nepodporuje přehrávání řeči.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(item.en);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}$('play').onclick=say;function mark(ok,info){if(answered)return;answered=true;if(ok)correct++;else wrong.push(item);$('feedback').className=ok?'good':'bad';$('feedback').textContent=(ok?'Správně!':'Ještě procvičit.')+' '+info+' | '+item.en+' = '+item.cz;$('score').textContent=`Správně ${correct}`;}function check(){if(answered)return;let val=norm($('answer').value);if(!val)return;let expected=dir==='cz-en'?item.en:item.cz;let variants=expected.split(';').map(norm);let ok=variants.includes(val);mark(ok,`Tvoje odpověď: ${$('answer').value}.`)}$('check').onclick=check;$('answer').onkeydown=e=>{if(e.key==='Enter'){if(answered)next();else check()}};$('reveal').onclick=()=>mark(false,'Zobrazená odpověď.');function next(){if(!answered)wrong.push(item);i++;show()}$('next').onclick=next;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SR)return $('feedback').textContent='Rozpoznávání řeči není v tomto prohlížeči dostupné. Zkus Chrome nebo Edge a povol mikrofon.';let r=new SR();r.lang='en-GB';r.interimResults=false;r.maxAlternatives=3;$('feedback').textContent='Poslouchám…';r.onresult=e=>{let heard=Array.from(e.results[0]).map(x=>x.transcript);let ok=heard.some(x=>norm(x)===norm(item.en));mark(ok,'Rozpoznáno: '+heard[0]+'. Hodnocení je pouze orientační.');};r.onerror=e=>$('feedback').textContent='Mikrofon: '+e.error;r.start()};function save(){let s=JSON.parse(localStorage.getItem('englishTrainerStats')||'{"sessions":0,"correct":0,"total":0}');s.sessions++;s.correct+=correct;s.total+=deck.length;localStorage.setItem('englishTrainerStats',JSON.stringify(s));localStorage.setItem('englishTrainerWrong',JSON.stringify(wrong));summary()}function summary(){let s=JSON.parse(localStorage.getItem('englishTrainerStats')||'{"sessions":0,"correct":0,"total":0}');$('summary').textContent=`Procvičování: ${s.sessions} · Správně: ${s.correct}/${s.total} · Úspěšnost: ${s.total?Math.round(s.correct/s.total*100):0} %`};summary();$('mistakes').onclick=()=>{let w=JSON.parse(localStorage.getItem('englishTrainerWrong')||'[]');if(!w.length)return alert('Zatím nemáš uložená chybná slovíčka.');start(w)};$('reset').onclick=()=>{if(confirm('Opravdu smazat uložené výsledky?')){localStorage.removeItem('englishTrainerStats');localStorage.removeItem('englishTrainerWrong');summary()}};
